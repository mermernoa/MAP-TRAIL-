# Réglages du projet Supabase « TakeTonTrail » envoyés par `supabase config push`
# (workflow .github/workflows/supabase-config.yml). Seuls les réglages déclarés ici
# sont modifiés sur le projet : le reste (API, base, stockage) garde ses valeurs.
project_id = "take-ton-trail"

[auth]
# Adresse du site : sert de retour par défaut après les e-mails.
site_url = "https://mermernoa.github.io/MAP-TRAIL-/"
additional_redirect_urls = ["https://mermernoa.github.io/MAP-TRAIL-/**", "http://localhost:5173/**"]
enable_signup = true
enable_anonymous_sign_ins = false
# Même règle que le formulaire du site : 8 caractères, des lettres et des chiffres.
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
# E-mails envoyés par heure (pris en compte avec un serveur SMTP personnalisé).
email_sent = 30

[auth.email]
enable_signup = true
# Confirmation de l'adresse avant la première connexion.
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

# E-mails en français aux couleurs de Take Ton Trail (supabase/templates/).
# Les liens ramènent sur /compte?token_hash=…&type=…, valides sur n'importe quel appareil.
[auth.email.template.confirmation]
subject = "Confirme ton adresse – Take Ton Trail"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Choisis un nouveau mot de passe – Take Ton Trail"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirme ta nouvelle adresse – Take Ton Trail"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "Ton invitation sur Take Ton Trail"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Ton lien de connexion – Take Ton Trail"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.reauthentication]
subject = "Ton code de sécurité – Take Ton Trail"
content_path = "./supabase/templates/reauthentication.html"

# Serveur d'envoi : ajouté par le workflow si le secret SMTP_PASSWORD existe
# (mot de passe d'application Gmail de taketontrail@gmail.com). Sans lui, Supabase
# envoie depuis son adresse par défaut, limitée aux membres de l'équipe.
