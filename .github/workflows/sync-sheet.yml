name: Synchronisation de la feuille

# Régénère public/data/races.json depuis la feuille Google « Maps Trail - Base des courses ».
# Lancement manuel (Actions → Synchronisation de la feuille → Run workflow), ou chaque matin
# quand la variable de dépôt SHEET_SYNC vaut « on ».
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.SHEET_SYNC == 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Importer la feuille
        env:
          # Lien CSV de l'onglet Courses (secret facultatif). Sans lui, l'export par lien
          # partagé est utilisé : la feuille doit alors être lisible par toute personne disposant du lien.
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: npm run import:sheet
      - run: npm test
      - name: Publier les changements
        run: |
          if git diff --quiet -- public/data/races.json data/rapport-import.md; then
            echo "Base inchangée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/races.json data/rapport-import.md
          git commit -m "Mettre à jour la base des courses depuis la feuille"
          git push
