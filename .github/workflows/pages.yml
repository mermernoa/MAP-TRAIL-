name: Déploiement GitHub Pages

on:
  push:
    branches: [main, claude/interactive-trails-map-rxpucs]
  workflow_dispatch:
  # Les commits poussés par la synchronisation ne déclenchent pas « push » : on redéploie après elle.
  workflow_run:
    workflows: ['Synchronisation de la feuille']
    types: [completed]
    branches: [main, claude/interactive-trails-map-rxpucs]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Après une synchronisation, on construit la branche qu'elle vient de mettre à jour.
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Sauvegarde : le site d'avant la version immersive 3D reste en ligne sous /sauvegarde/.
      - name: Construire la sauvegarde (version du 6 octobre 2026)
        run: |
          git fetch --depth=1 origin a5b225be3529b7bd78f5fd6840a92074f7eda40d
          git worktree add --detach "$RUNNER_TEMP/sauvegarde" FETCH_HEAD
          cd "$RUNNER_TEMP/sauvegarde"
          npm ci
          npx vite build --outDir "$GITHUB_WORKSPACE/dist/sauvegarde" --emptyOutDir
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
